<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A1 Downloader — Fast & Clean Video & File Downloader</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
    }

    .clean-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .clean-input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      transition: border-color 0.15s ease;
    }
    .clean-input:focus {
      outline: none;
      border-color: #0f172a;
    }

    .btn-primary {
      background-color: #0f172a;
      color: #ffffff;
      transition: background-color 0.15s ease;
    }
    .btn-primary:hover {
      background-color: #1e293b;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
      transition: background-color 0.15s ease;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .progress-fill {
      background-color: #0f172a;
      transition: width 0.25s ease;
    }
  </style>
</head>

<body class="flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      
      <!-- Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 bg-slate-900 rounded-md flex items-center justify-center font-bold text-white text-xs">
          A1
        </div>
        <span class="font-bold text-slate-900 text-sm tracking-tight">
          A1 Downloader
        </span>
      </div>

      <!-- Real-time network speed pill -->
      <div class="flex items-center gap-2 bg-slate-100 border border-slate-200 px-3 py-1 rounded-md text-xs font-mono text-slate-700">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span id="speed-meter" class="font-semibold">0.0 MB/s</span>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">

    <!-- HERO HEADER -->
    <div class="space-y-1">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
        Video & File Downloader
      </h1>
      <p class="text-xs text-slate-500">
        Multi-threaded download manager for YouTube, TikTok, Facebook, Instagram, and direct file links.
      </p>
    </div>

    <!-- MAIN DOWNLOAD INPUT BOX -->
    <div class="clean-card p-5 space-y-3.5">
      
      <!-- Input bar -->
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <input
            id="url-input"
            type="text"
            oninput="detectPlatform(this.value)"
            placeholder="Paste URL here..."
            class="clean-input w-full pl-3.5 pr-20 py-2.5 rounded-lg text-sm text-slate-900 placeholder-slate-400 font-medium"
          />
          <button
            onclick="pasteFromClipboard()"
            class="absolute inset-y-1 right-1 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition border border-slate-200 flex items-center gap-1">
            <i data-lucide="clipboard" class="w-3 h-3"></i> Paste
          </button>
        </div>

        <div class="flex gap-2">
          <button
            onclick="inspectLink()"
            id="btn-inspect"
            class="btn-secondary px-3.5 py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-1">
            <i data-lucide="search" class="w-3.5 h-3.5"></i> Inspect
          </button>
          <button
            onclick="startDownload()"
            id="btn-download"
            class="btn-primary px-5 py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Download
          </button>
        </div>
      </div>

      <!-- Settings & Detected Platform Row -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100 text-xs">
        
        <div class="flex flex-wrap items-center gap-3 text-slate-600">
          <!-- Platform Badge -->
          <div id="platform-tag" class="hidden text-xs font-medium px-2 py-0.5 rounded border"></div>

          <!-- Threads selection -->
          <div class="flex items-center gap-1.5">
            <span class="text-slate-500">Threads:</span>
            <select id="threads-select" class="bg-white border border-slate-200 rounded px-2 py-0.5 text-slate-800 text-xs font-medium focus:outline-none">
              <option value="4">4 Chunks</option>
              <option value="8" selected>8 Chunks (Default)</option>
              <option value="16">16 Chunks</option>
              <option value="32">32 Chunks</option>
            </select>
          </div>

          <!-- Format selection -->
          <div id="media-options" class="hidden flex items-center gap-1.5">
            <span class="text-slate-500">Format:</span>
            <select id="format-select" class="bg-white border border-slate-200 rounded px-2 py-0.5 text-slate-800 text-xs font-medium focus:outline-none">
              <option value="bestvideo+bestaudio/best">Best Available (Video+Audio)</option>
              <option value="bestaudio/best">Audio Only (MP3)</option>
            </select>
          </div>
        </div>

        <span class="text-slate-400 text-xs">Direct chunk acceleration</span>
      </div>

    </div>

    <!-- ACTIVE DOWNLOADS SECTION -->
    <div class="space-y-2.5">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">
        Active Queue
      </h2>

      <div id="tasks-container" class="space-y-2">
        <div class="clean-card p-6 text-center text-slate-400 text-xs">
          No active transfers.
        </div>
      </div>
    </div>

    <!-- COMPLETED DOWNLOADS SECTION -->
    <div class="clean-card p-5 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">
          Downloaded Files
        </h2>
        <button onclick="loadFiles()" class="text-xs text-slate-500 hover:text-slate-900 flex items-center gap-1 transition">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
        </button>
      </div>

      <div id="files-list" class="divide-y divide-slate-100 text-xs"></div>
    </div>

  </main>

  <!-- MINIMAL FOOTER -->
  <footer class="border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    <p>A1 Downloader</p>
  </footer>

  <script>
    lucide.createIcons();
    let currentTasks = [];

    function detectPlatform(val) {
      val = val.trim().toLowerCase();
      const tag = document.getElementById('platform-tag');
      const mediaOpt = document.getElementById('media-options');

      if (!val) {
        tag.classList.add('hidden');
        mediaOpt.classList.add('hidden');
        return;
      }

      tag.classList.remove('hidden');
      if (val.includes('youtube.com') || val.includes('youtu.be')) {
        tag.className = 'text-xs font-medium px-2 py-0.5 rounded bg-red-50 text-red-700 border border-red-200';
        tag.innerHTML = 'YouTube';
        mediaOpt.classList.remove('hidden');
      } else if (val.includes('facebook.com') || val.includes('fb.watch')) {
        tag.className = 'text-xs font-medium px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200';
        tag.innerHTML = 'Facebook';
        mediaOpt.classList.remove('hidden');
      } else if (val.includes('tiktok.com')) {
        tag.className = 'text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200';
        tag.innerHTML = 'TikTok';
        mediaOpt.classList.remove('hidden');
      } else if (val.includes('instagram.com')) {
        tag.className = 'text-xs font-medium px-2 py-0.5 rounded bg-purple-50 text-purple-700 border border-purple-200';
        tag.innerHTML = 'Instagram';
        mediaOpt.classList.remove('hidden');
      } else {
        tag.className = 'text-xs font-medium px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200';
        tag.innerHTML = 'Direct File';
        mediaOpt.classList.add('hidden');
      }
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('url-input').value = text;
          detectPlatform(text);
        }
      } catch (e) {
        alert('Please allow clipboard access in your browser.');
      }
    }

    // WebSocket real-time updates
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      currentTasks = data.tasks || [];
      renderTasks(currentTasks);
      
      const active = currentTasks.filter(t => t.status === 'downloading');
      const totalSpeed = active.reduce((sum, t) => sum + (t.speed_mb || 0), 0);
      document.getElementById('speed-meter').innerText = `${totalSpeed.toFixed(1)} MB/s`;
    };

    async function inspectLink() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) return alert('Please paste a link first!');
      const btn = document.getElementById('btn-inspect');
      btn.innerText = 'Checking...';
      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ url })
        });
        const d = await res.json();
        if (d.type === 'media') {
          document.getElementById('media-options').classList.remove('hidden');
          alert(`Media: ${d.title}`);
        } else {
          document.getElementById('media-options').classList.add('hidden');
          alert(`File: ${d.filename} (${(d.filesize / 1024 / 1024).toFixed(1)} MB)`);
        }
      } catch (err) {
        alert('Inspection error: ' + err);
      } finally {
        btn.innerHTML = '<i data-lucide="search" class="w-3.5 h-3.5"></i> Inspect';
        lucide.createIcons();
      }
    }

    async function startDownload() {
      const url = document.getElementById('url-input').value.trim();
      if (!url) return alert('Please paste a link first!');
      const threads = parseInt(document.getElementById('threads-select').value);
      const format_id = document.getElementById('format-select').value;

      await fetch('/api/download', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url, format_id, threads })
      });

      document.getElementById('url-input').value = '';
      detectPlatform('');
      loadFiles();
    }

    async function controlTask(id, act) {
      await fetch(`/api/tasks/${id}/${act}`, { method: 'POST' });
    }

    function renderTasks(tasks) {
      const c = document.getElementById('tasks-container');
      if (!tasks || !tasks.length) {
        c.innerHTML = '<div class="clean-card p-6 text-center text-slate-400 text-xs">No active transfers.</div>';
        return;
      }

      c.innerHTML = tasks.map(t => {
        const isDone = t.status === 'completed';
        const isFail = t.status === 'failed';
        const isPaused = t.status === 'paused';
        const isActive = t.status === 'downloading' || t.status === 'merging';

        return `
          <div class="clean-card p-4 space-y-2.5">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-2 min-w-0">
                <span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[11px] font-semibold border border-slate-200 shrink-0">
                  ${t.threads}×
                </span>
                <span class="font-medium text-slate-900 text-xs truncate" title="${t.title || t.filename}">${t.title || t.filename}</span>
              </div>
              <span class="text-[11px] font-mono px-2 py-0.5 rounded uppercase font-medium ${
                isDone ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                isFail ? 'bg-rose-50 text-rose-700 border border-rose-200' :
                isPaused ? 'bg-amber-50 text-amber-700 border border-amber-200' :
                'bg-slate-100 text-slate-700 border border-slate-200'
              }">${t.status}</span>
            </div>

            <!-- Single solid progress bar (no gradient) -->
            <div class="w-full bg-slate-100 rounded h-1.5 overflow-hidden">
              <div class="${isDone ? 'bg-emerald-600' : isFail ? 'bg-rose-600' : 'progress-fill'} h-full rounded" style="width: ${t.percent}%"></div>
            </div>

            <!-- Stats & Action Buttons -->
            <div class="flex items-center justify-between text-[11px] font-mono text-slate-500">
              <div class="flex items-center gap-2.5">
                <span class="text-slate-900 font-semibold">${t.percent}%</span>
                <span>${(t.downloaded_bytes / 1024 / 1024).toFixed(1)} / ${(t.total_bytes / 1024 / 1024).toFixed(1)} MB</span>
                ${isActive ? `<span class="text-slate-800 font-medium">${t.speed_mb} MB/s</span>` : ''}
                ${isActive && t.eta ? `<span>ETA: ${t.eta}s</span>` : ''}
              </div>

              <div class="flex items-center gap-1">
                ${isActive ? `
                  <button onclick="controlTask('${t.id}','pause')" class="p-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition" title="Pause">
                    <i data-lucide="pause" class="w-3 h-3"></i>
                  </button>
                ` : ''}
                ${isPaused ? `
                  <button onclick="controlTask('${t.id}','resume')" class="p-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition" title="Resume">
                    <i data-lucide="play" class="w-3 h-3"></i>
                  </button>
                ` : ''}
                ${isDone ? `
                  <a href="/api/files/${encodeURIComponent(t.filename)}" download class="px-2.5 py-0.5 bg-slate-900 hover:bg-slate-800 text-white rounded text-[11px] font-medium flex items-center gap-1 transition">
                    <i data-lucide="download" class="w-3 h-3"></i> Save
                  </a>
                ` : ''}
                <button onclick="controlTask('${t.id}','cancel')" class="p-1 bg-slate-100 hover:bg-rose-100 hover:text-rose-700 text-slate-500 rounded transition" title="Cancel">
                  <i data-lucide="x" class="w-3 h-3"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function loadFiles() {
      const res = await fetch('/api/files');
      const files = await res.json();
      const c = document.getElementById('files-list');

      if (!files.length) {
        c.innerHTML = '<p class="py-4 text-center text-slate-400 text-xs">No downloaded files yet.</p>';
        return;
      }

      c.innerHTML = files.map(f => `
        <div class="py-2.5 flex items-center justify-between gap-3">
          <div class="flex items-center gap-2.5 min-w-0">
            <i data-lucide="file" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <div class="min-w-0">
              <p class="font-medium text-slate-800 truncate" title="${f.name}">${f.name}</p>
              <p class="text-[11px] text-slate-400 font-mono">${f.size_mb} MB</p>
            </div>
          </div>
          <a href="/api/files/${encodeURIComponent(f.name)}" download
             class="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-medium flex items-center gap-1 transition shrink-0">
            <i data-lucide="download" class="w-3 h-3"></i> Save
          </a>
        </div>
      `).join('');
      lucide.createIcons();
    }

    loadFiles();
    setInterval(loadFiles, 10000);
  </script>
</body>
</html>
